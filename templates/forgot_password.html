<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('app_name') }} — {{ t('forgot_pwd_title') }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .auth-lang-btn{position:absolute;top:18px;{% if dir == 'rtl' %}left:18px{% else %}right:18px{% endif %};display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--white);color:var(--text);font-weight:700;font-size:.8rem;cursor:pointer;text-decoration:none;}
        .auth-lang-btn:hover{background:var(--rose-light);color:var(--primary);}
    </style>
</head>
<body>
<div class="auth-page">
    <div class="auth-container">
        <a href="{{ url_for('set_language', code='en' if lang == 'ar' else 'ar') }}" class="auth-lang-btn" title="{{ t('lang_toggle_title') }}">{{ t('lang_toggle') }}</a>
        <div class="auth-illustration">
            <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="30" y="130" width="140" height="8" rx="4" fill="#8B4513" opacity="0.7"/>
                <rect x="45" y="50" width="110" height="80" rx="6" fill="#8B4513" opacity="0.15" stroke="#8B4513" stroke-width="2"/>
                <circle cx="120" cy="75" r="20" fill="#8B4513" opacity="0.15" stroke="#8B4513" stroke-width="1.5"/>
            </svg>
        </div>
        <div class="auth-form-section">
            <div class="auth-logo">نهج<span style="display:block;font-size:0.4em;font-weight:600;letter-spacing:3px;font-family:'Poppins',sans-serif;opacity:0.7;text-transform:uppercase;">NAHJ</span></div>
            <div class="auth-subtitle">{{ t('forgot_pwd_subtitle')|safe }}</div>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="flash flash-{{ category }}" style="margin-bottom:14px;">
                {{ message }}
                <button class="flash-close" onclick="this.parentElement.remove()">&times;</button>
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST">
                <input type="email" name="email" class="auth-input" placeholder="{{ t('email_placeholder') }}" required>
                <button type="submit" class="auth-btn">{{ t('send') }}</button>
            </form>

            <div class="auth-link">
                <a href="{{ url_for('login') }}">{{ t('back_to_login') }}</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
